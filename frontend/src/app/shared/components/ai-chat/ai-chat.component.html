<section class="container card" style="padding:1rem;margin:2rem auto"><h2>Shopping assistant</h2><p>Catalog-grounded recommendations.</p><form (ngSubmit)="ask()"><input [(ngModel)]="question" name="question" maxlength="500" placeholder="Ask about products"><button [disabled]="loading">{{loading ? 'Searching...' : 'Ask'}}</button></form><p *ngIf="error" role="alert">{{error}}</p><div *ngIf="response"><p>{{response.answer}}</p><ul><li *ngFor="let product of response.recommendations"><a [routerLink]="['/products', product.productId]">{{product.name}}</a> — {{product.price | currency}}</li></ul></div></section>
